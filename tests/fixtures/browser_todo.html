<!doctype html>
<html>
<head><title>Todo Fixture</title></head>
<body>
<div id="gate" role="dialog" aria-modal="true" style="position:fixed;inset:0;background:#fff;padding:40px">
  <h2>Welcome</h2>
  <p>Please continue to the app.</p>
  <button id="continue" onclick="document.getElementById('gate').remove()">Continue</button>
</div>
<main>
  <h1>My Todos</h1>
  <form onsubmit="event.preventDefault(); add()">
    <label for="new">New item</label>
    <input id="new" type="text" placeholder="What needs doing?">
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
  <a href="/about.html">About this app</a>
  <a href="/browser_help.html" target="_blank">Open help</a>
  <button type="button" onclick="alert('Nope')">Alert me</button>
  <a href="#" style="display:none">hidden link</a>
</main>
<script>
  function add() {
    const input = document.getElementById('new');
    if (!input.value.trim()) return;
    const li = document.createElement('li');
    li.textContent = input.value.trim();
    document.getElementById('list').appendChild(li);
    input.value = '';
  }
</script>
</body>
</html>
